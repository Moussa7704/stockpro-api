name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Installe la version de pnpm indiquée dans "packageManager" (package.json)
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # En CI, pnpm refuse d'installer si pnpm-lock.yaml n'est pas à jour
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # tsc vérifie les types et compile : une erreur TypeScript fait échouer la CI
      - name: Build
        run: pnpm build
